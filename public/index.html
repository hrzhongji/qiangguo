<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F6F1E7" />
<title>晒名片 · 沈知远 | 24 小时在线的电子名片</title>
<meta name="description" content="晒名片 —— 会对话、会追踪、能成交的 AI 电子名片。数字分身 24 小时应答，访客行为实时追踪，NFC 一碰即换。" />
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient-glow g1"></span>
    <span class="ambient-glow g2"></span>
    <span class="ambient-grain"></span>
  </div>

  <!-- 桌面端品牌侧栏 + 设备预览 -->
  <div class="card-shell" id="cardShell">
    <aside class="rail">
      <div class="rail-brand">
        <img src="/assets/logo.svg" alt="晒名片" class="rail-logo" />
        <div class="rail-wordmark">
          <b>晒名片</b>
          <span>SHINE CARD</span>
        </div>
      </div>

      <div class="rail-copy">
        <p class="rail-eyebrow">AI 电子名片 · 2026</p>
        <h1>把一张名片，<br />变成<span>24 小时在线</span>的你。</h1>
        <p class="rail-sub">数字分身接住每一条线索，行为追踪读懂每一个意向。名片不再是被动展示，而是你最小的成交现场。</p>
      </div>

      <div class="rail-features">
        <div class="rail-feature"><i data-icon="spark"></i><span>AI 数字分身</span></div>
        <div class="rail-feature"><i data-icon="pulse"></i><span>访客意向追踪</span></div>
        <div class="rail-feature"><i data-icon="nfc"></i><span>NFC 一碰即换</span></div>
        <div class="rail-feature"><i data-icon="shield"></i><span>企业资产继承</span></div>
      </div>

      <div class="rail-profile">
        <p class="rail-label">演示 · 切换访客画像</p>
        <div class="profile-switch" id="profileSwitch">
          <button data-profile="manufacturing" class="active">制造业客户</button>
          <button data-profile="overseas">海外买家</button>
          <button data-profile="investor">投资 / 合作</button>
        </div>
        <p class="rail-hint" id="profileHint">首页将优先置顶「苏州降本 23%」案例</p>
      </div>

      <div class="rail-foot">
        <div class="rail-qr">
          <img id="railQr" src="/api/qr?text=%2F" alt="名片二维码" />
        </div>
        <div class="rail-foot-copy">
          <b>扫码体验访客端</b>
          <span>手机微信 / 浏览器打开</span>
          <button class="rail-enter" id="enterConsole">进入企业后台 <i data-icon="arrow"></i></button>
        </div>
      </div>
    </aside>

    <div class="device-wrap">
      <div class="device">
        <div class="device-notch"></div>
        <div class="screen" id="screenRoot">
          <div class="statusbar">
            <span id="clock">9:41</span>
            <span class="status-icons">
              <i data-icon="signal"></i><i data-icon="wifi"></i><i data-icon="battery"></i>
            </span>
          </div>
          <main class="screen-body" id="screen"></main>
          <nav class="tabbar" id="tabbar"></nav>
          <div class="screen-layer" id="layerRoot"></div>
        </div>
      </div>
      <p class="device-caption">真实设备预览 · 数据实时同步</p>
    </div>
  </div>

  <!-- 企业后台 -->
  <div class="console-shell hidden" id="consoleShell"></div>

  <div class="toast-root" id="toastRoot"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/card.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
